[project]
name = "financial-data-poc"
version = "0.1.0"
description = "Local-first financial data pipeline PoC"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb>=1.3,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "plotly>=6,<7",
    "pyarrow>=19,<26",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "requests>=2.32,<3",
    "streamlit>=1.45,<2",
    "streamlit-option-menu>=0.4,<1",
    "uvicorn[standard]>=0.34,<1",
    "vnstock>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

